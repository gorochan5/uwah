[package]
name = "uwah"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
maud = { version = "0.27.0", features = ["axum"] }
nu-ansi-term = "0.50.3"
prost = "0.14.4"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.5"
tonic = "0.14.6"
tower = { version = "0.5.3", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "local-time", "fmt"] }
whatsapp-rust = "0.7.0"

[build-dependencies]
tonic-build = "0.12"
