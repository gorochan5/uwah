syntax = "proto3";

package uwah.v1;

service GroupService {
  rpc CreateGroup (CreateGroupRequest) returns (CreateGroupResponse);
  rpc JoinGroup (JoinGroupRequest) returns (JoinGroupResponse);
}

service GroupParticipantService {
  rpc ListParticipants (ListParticipantsRequest) returns (ListParticipantsResponse);
  rpc AddParticipants (AddParticipantsRequest) returns (ParticipantActionResponse);
  rpc RemoveParticipant (RemoveParticipantRequest) returns (ParticipantActionResponse);
  rpc PromoteParticipants (ModifyParticipantRolesRequest) returns (ParticipantActionResponse);
  rpc DemoteParticipants (ModifyParticipantRolesRequest) returns (ParticipantActionResponse);
}

message CreateGroupRequest {
  string session_id = 1;
  string subject = 2;
  repeated string participants = 3;
}

message CreateGroupResponse {
  string session_id = 1;
  string group_jid = 2;
  string subject = 3;
  repeated GroupParticipantItem participants = 4;
}

message JoinGroupRequest {
  string session_id = 1;
  string invite_code = 2;
}

message JoinGroupResponse {
  string session_id = 1;
  string group_jid = 2;
  string status = 3;
}

message GroupParticipantItem {
  string user_jid = 1;
  string role = 2; // "admin", "superadmin", "member"
}

message ListParticipantsRequest {
  string session_id = 1;
  string jid = 2;
}

message ListParticipantsResponse {
  repeated GroupParticipantItem participants = 1;
}

message AddParticipantsRequest {
  string session_id = 1;
  string jid = 2;
  repeated string participants = 3;
}

message RemoveParticipantRequest {
  string session_id = 1;
  string jid = 2;
  string user_jid = 3;
}

message ModifyParticipantRolesRequest {
  string session_id = 1;
  string jid = 2;
  repeated string participants = 3;
}

message ParticipantActionResult {
  string user_jid = 1;
  string status = 2;
  optional string error = 3;
}

message ParticipantActionResponse {
  string session_id = 1;
  string group_jid = 2;
  repeated ParticipantActionResult results = 3;
}
